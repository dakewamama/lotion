[package]
name = "lotion"
version = "0.1.0"
edition = "2021"
description = "Post-quantum signed gossip primitive for Solana. Hash-based Winternitz signatures over UDP."
license = "MIT"
authors = ["dakewamama"]
repository = "https://github.com/dakewamama/lotion"
readme = "README.md"
keywords = ["solana", "post-quantum", "winternitz", "gossip"]
categories = ["cryptography", "network-programming"]

[dependencies]
solana-winternitz = "0.1.1"
solana-nostd-keccak = "0.1.3"
serde = { version = "1", features = ["derive"] }
bincode = "1"
serde-big-array = "0.5"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[[bin]]
name = "sender"
path = "src/bin/sender.rs"

[[bin]]
name = "receiver"
path = "src/bin/receiver.rs"