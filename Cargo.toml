[package]
name = "lotion"
version = "0.1.0"
edition = "2024"
description = "Post-quantum signed gossip primitive for Solana. Hash-based Winternitz signatures over UDP."
license = "MIT"

[dependencies]
solana-winternitz = "0.1.1"
solana-nostd-keccak = "0.1.3"
serde = { version = "1", features = ["derive"] }
bincode = "1"
serde-big-array = "0.5"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[[bin]]
name = "sender"
path = "src/bin/sender.rs"